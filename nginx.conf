server {
    listen 8080;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # Include default mime types to ensure CSS/JS load correctly
    include /etc/nginx/mime.types;

    # Gzip settings for performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Handle SPA routing - Redirect all 404s to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Strict Cache Control for index.html
    # This ensures users always get the latest deployment immediately.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Cache static assets (hashed filenames generated by Vite) for 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}